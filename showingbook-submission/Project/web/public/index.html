<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CRM and viewing calendar for independent real estate agents: leads, showings, listings and follow-ups.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#2D6A6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShowingBook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<title>ShowingBook – CRM and viewing calendar for agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme-init.js"></script>
</head>
<body data-state="anon">
<div class="app">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 100 100" width="42" height="42" role="img" aria-hidden="true"><path d="M50 6 L90 30 V80 a10 10 0 0 1 -10 10 H20 a10 10 0 0 1 -10 -10 V30 Z" fill="var(--brand)" stroke="var(--brand)" stroke-width="4" stroke-linejoin="round"/><g fill="var(--on-brand)"><rect x="23" y="44" width="12" height="12" rx="3"/><rect x="44" y="44" width="12" height="12" rx="3"/><rect x="23" y="65" width="12" height="12" rx="3"/><rect x="65" y="65" width="12" height="12" rx="3"/></g><rect x="65" y="44" width="12" height="12" rx="3" fill="var(--on-brand)" opacity=".35"/><rect x="44" y="65" width="12" height="12" rx="3" fill="var(--brass)"/><path d="M46.5 71.2 l2.6 2.6 l4.6 -5" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="26" r="4.2" fill="var(--brass)"/></svg><span>ShowingBook</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="cal" id="t-cal" aria-selected="true">Calendar</button>
      <button role="tab" data-view="cli" id="t-cli" aria-selected="false">Leads</button>
      <button role="tab" data-view="lst" id="t-lst" aria-selected="false">Listings</button>
      <button role="tab" data-view="tsk" id="t-tsk" aria-selected="false">Follow-ups</button>
      <button role="tab" data-view="rep" id="t-rep" aria-selected="false">Reports</button>
      <button role="tab" data-view="team" id="t-team" aria-selected="false" hidden>Team</button>
    </nav>
    <button class="btn" id="theme" type="button">Dark</button>
    <button class="btn pri" id="install" type="button" hidden>Install app</button>
    <span class="hdr-actions">
      <button class="btn" id="addC" type="button">Add lead</button>
      <button class="btn pri" id="addV" type="button">New viewing</button>
      <button class="btn" id="account" type="button" aria-label="My account"></button>
    </span>
  </header>

  <section id="login" class="login panel">
    <form id="login-form" autocomplete="on">
      <h1>Sign in</h1>
      <p>Use the account your administrator created for you.</p>
      <div class="err" id="login-error" role="alert" hidden></div>
      <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
      <button class="btn pri" id="login-submit">Sign in</button>
    </form>
  </section>

  <main id="main"></main>
</div>
<dialog id="dlg"><form id="frm"></form></dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
